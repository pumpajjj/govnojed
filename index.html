<!DOCTYPE html>
<!--
GOVNOJED - Igra o propagandnoj kurvi koja prodaje dušu đavolu za novac i jede govna po ceo dan.
Propagandna mašina koja služi sistemu i blati narod za pare, dok se hrani govnima i bljuje laži.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GOVNOJED</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="GOVNOJED - Igra o propagandnoj kurvi koja prodaje dušu đavolu za novac i jede govna po ceo dan.">
  <meta name="keywords" content="govnojed, propagandna mašina, duša, đavol, novac, govna, laž, blat, narod, pare">
  <meta name="author" content="GOVNOJED">
  <meta name="robots" content="index, follow">
  <meta name="googlebot" content="index, follow">
  <meta name="google" content="notranslate">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💩</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
    <style>
      html, body { 
        margin: 0; 
        padding: 0; 
        height: 100%; 
        background: #000; 
        overflow: hidden;
      }
      body { 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        min-height: 100vh;
        width: 100%;
      }
      canvas { 
        display: block; 
        margin: 0 auto; 
        width: 100vw !important;
        height: auto !important;
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
      }
      
      /* Mobile touch area - invisible overlay */
      .mobile-touch-area {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1000;
        pointer-events: auto;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: manipulation;
      }
      
      /* Hide on desktop */
      @media (min-width: 768px) {
        .mobile-touch-area {
          display: none;
        }
      }
    </style>
</head>
<body>
  <!-- Mobile touch area -->
  <div class="mobile-touch-area" id="mobileTouchArea"></div>
<script>
class StartScene extends Phaser.Scene {
  constructor() {
    super('StartScene');
  }

  preload() {
    this.load.image('bg', 'assets/bg.png');
    this.load.atlas('govnojed', 'assets/govnojed.png', 'assets/govnojed.json');
  }

  create() {
    const { width, height } = this.sys.game.config;

    // Background
    this.bg = this.add.tileSprite(0, 0, width * 2, height, 'bg').setOrigin(0, 0);
    this.bg.setDepth(0);

    // Create vignette overlay
    this.vignette = this.add.graphics();
    this.vignette.fillGradientStyle(0x000000, 0x000000, 0x000000, 0x000000, 0.3, 0.3, 0.7, 0.7);
    this.vignette.fillRect(0, 0, width, height);
    this.vignette.setDepth(1);

    // Game title drops from top
    this.title = this.add.image(width / 2, -100, 'govnojed', 'govnojed.png');
    this.title.setOrigin(0.5, 0.5);
    this.title.setDepth(2);

    // Title drop animation
    this.tweens.add({
      targets: this.title,
      y: height / 2 - 200,
      duration: 1000,
      ease: 'Bounce.easeOut'
    });

    // Poop appears in center
    this.startPoo = this.add.image(width / 2, height / 2, 'govnojed', 'poop.png');
    this.startPoo.setOrigin(0.5, 0.5);
    this.startPoo.setScale(0);
    this.startPoo.setDepth(2);

    // Poop scale animation
    this.tweens.add({
      targets: this.startPoo,
      scaleX: 1,
      scaleY: 1,
      duration: 800,
      delay: 500,
      ease: 'Bounce.easeOut'
    });

    // Start button appears from bottom
    this.startButton = this.add.image(width / 2, height + 100, 'govnojed', 'press-start.png');
    this.startButton.setOrigin(0.5, 0.5);
    this.startButton.setDepth(2);
    this.startButton.setInteractive();

    // Start button slide up animation
    this.tweens.add({
      targets: this.startButton,
      y: height / 2 + 150,
      duration: 800,
      delay: 1000,
      ease: 'Bounce.easeOut'
    });

    // Start button click handler
    this.startButton.on('pointerdown', () => {
      this.scene.start('GameScene');
    });
    
    // Mobile touch support for start screen
    this.startButton.setInteractive();
    this.startButton.on('pointerup', () => {
      this.scene.start('GameScene');
    });

    // Multiple keys to start
    this.startKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    this.enterKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.ENTER);
    this.cursors = this.input.keyboard.createCursorKeys();
  }

  update() {
    // Check for any start input
    const spacePressed = this.startKey && Phaser.Input.Keyboard.JustDown(this.startKey);
    const enterPressed = this.enterKey && Phaser.Input.Keyboard.JustDown(this.enterKey);
    const upPressed = this.cursors && Phaser.Input.Keyboard.JustDown(this.cursors.up);
    const downPressed = this.cursors && Phaser.Input.Keyboard.JustDown(this.cursors.down);
    const leftPressed = this.cursors && Phaser.Input.Keyboard.JustDown(this.cursors.left);
    const rightPressed = this.cursors && Phaser.Input.Keyboard.JustDown(this.cursors.right);
    
    if (spacePressed || enterPressed || upPressed || downPressed || leftPressed || rightPressed) {
      this.scene.start('GameScene');
    }
  }
}

class GameOverScene extends Phaser.Scene {
  constructor() {
    super('GameOverScene');
  }

  init(data) {
    // Receive data from the game scene
    this.finalScore = data.score || 0;
    this.highScore = data.highScore || 0;
    this.isNewHighScore = data.isNewHighScore || false;
  }

  preload() {
    this.load.image('bg', 'assets/bg.png');
    this.load.atlas('govnojed', 'assets/govnojed.png', 'assets/govnojed.json');
  }

  create() {
    const { width, height } = this.sys.game.config;

    // Background
    this.bg = this.add.tileSprite(0, 0, width * 2, height, 'bg').setOrigin(0, 0);
    this.bg.setDepth(0);

    // Create fade overlay
    this.gameOverOverlay = this.add.graphics();
    this.gameOverOverlay.fillStyle(0x000000, 0.5);
    this.gameOverOverlay.fillRect(0, 0, width, height);
    this.gameOverOverlay.setDepth(1);

    // Game Over sprite
    const gameOverSprite = this.add.image(width / 2, 120, 'govnojed', 'game-over.png');
    gameOverSprite.setOrigin(0.5, 0.5);
    gameOverSprite.setDepth(2);
    gameOverSprite.setScale(1.5);
        // Title drop animation
    this.tweens.add({
      targets: gameOverSprite,
      y: height / 2 - 150,
      duration: 1000,
      ease: 'Bounce.easeOut'
    });

    // Final score
    const finalScoreText = this.add.text(width / 2, height / 2 - 70, `💩 Final Score: ${this.finalScore}`, {
      fontSize: '32px',
      fill: '#ffffff'
    });
    finalScoreText.setOrigin(0.5, 0.5);
    finalScoreText.setDepth(2);

    // High score
    const highScoreText = this.add.text(width / 2, height / 2 - 20, `🏆 High Score: ${this.highScore}`, {
      fontSize: '28px',
      fill: '#ffff00'
    });
    highScoreText.setOrigin(0.5, 0.5);
    highScoreText.setDepth(2);

    // New high score message if applicable
    if (this.isNewHighScore) {
      const newHighScoreText = this.add.text(width / 2, height / 2 + 20, 'NEW HIGH SCORE!', {
        fontSize: '24px',
        fill: '#00ff00',
        fontStyle: 'bold'
      });
      newHighScoreText.setOrigin(0.5, 0.5);
      newHighScoreText.setDepth(2);
    }

    // Restart instruction
    const restartText = this.add.text(width / 2, height / 2 + 80, 'Press R to Restart', {
      fontSize: '24px',
      fill: '#ffff00'
    });
    restartText.setOrigin(0.5, 0.5);
    restartText.setDepth(2);

    // Add restart key
    this.restartKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.R);
    
    // Mobile touch support for restart
    this.input.on('pointerdown', () => {
      this.scene.start('GameScene');
    });
  }

  update() {
    if (this.restartKey && Phaser.Input.Keyboard.JustDown(this.restartKey)) {
      this.scene.start('GameScene');
    }
  }
}

class ParallaxScene extends Phaser.Scene {
  constructor() {
    super('GameScene');
  }

  preload() {
    this.load.image('bg', 'assets/bg.png');
    this.load.image('fg', 'assets/fg.png');
    this.load.spritesheet('char', 'assets/char-running.png', { frameWidth: 320, frameHeight: 300 });
    this.load.spritesheet('charJump', 'assets/char-jumping.png', { frameWidth: 320, frameHeight: 300 });
    
    // Load emoji texture atlas
    this.load.atlas('govnojed', 'assets/govnojed.png', 'assets/govnojed.json');
  }

  create() {
    const { width, height } = this.sys.game.config;

    // Backgrounds
    this.bg = this.add.tileSprite(0, 0, width * 2, height, 'bg').setOrigin(0, 0);
    this.bg.setDepth(0); // Background at the back

    // Character
    this.char = this.add.sprite(width * 0.5, height * 0.65, 'char');
    this.char.setDepth(5); // Character between bg and fg
    
    // Character head collider rectangle
    this.charHeadCollider = {
      x: this.char.x - 20,  // Smaller width for head
      y: this.char.y - 80,  // Above the body
      width: 40,            // Smaller collider width
      height: 30            // Smaller collider height
    };

    // Item group (between bg and fg)
    this.itemGroup = this.add.group();
    this.itemGroup.setDepth(3); // Items between bg and fg

    // Foreground (on top of everything)
    this.fg = this.add.tileSprite(0, 0, width * 2, height, 'fg').setOrigin(0, 0);
    this.fg.setDepth(10); // Foreground on top of everything

    // Running animation
    this.anims.create({
      key: 'run',
      frames: this.anims.generateFrameNumbers('char', { start: 0, end: 4 }),
      frameRate: 8,
      repeat: -1
    });
    this.char.play('run');

    // Jump animation
    this.anims.create({
      key: 'jump',
      frames: this.anims.generateFrameNumbers('charJump', { start: 0, end: 4 }),
      frameRate: 8,
      repeat: -1
    });

    // Input
    this.cursors = this.input.keyboard.createCursorKeys();
    this.space = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    this.debugKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.D);
    
    // Mobile touch input
    this.mobileInput = {
      left: false,
      right: false,
      jump: false
    };
    this.mobileJumpPressed = false; // Track mobile jump state
    this.touchStartX = 0; // Store touch start position
    
    this.setupMobileControls();

    // Movement bounds
    this.minX = width * 0.15;
    this.maxX = width * 0.85;
    
    // Ground level for emojis (75% of screen height)
    this.groundLevel = height * 0.80;

    // Jump state
    this.isJumping = false;
    
    // Kick range
    this.kickRange = 60; // How far the kick reaches

    // Speed boost properties
    this.speedBoostActive = false;
    this.speedBoostDuration = 0;
    this.normalSpeed = 2; // Normal horizontal movement speed
    this.boostedSpeed = 5; // Speed when boosted

    // Slow-motion properties
    this.slowmoActive = false;
    this.slowmoDuration = 0;
    this.slowmoMultiplier = 0.5; // Items move at half speed


    // Spawn timer - starts slow and speeds up over time
    this.spawnDelay = 2000; // Start with 2 seconds
    this.minSpawnDelay = 300; // Minimum 0.3 seconds
    this.spawnAcceleration = 50; // Decrease delay by 50ms every spawn
    this.spawnTimer = this.time.addEvent({
      delay: this.spawnDelay,
      loop: true,
      callback: this.spawnItem,
      callbackScope: this
    });

    // Score / health
    this.score = 0;
    this.health = 3;
    this.highScore = this.loadHighScore();

    // Display
    this.scoreText = this.add.text(10, 10, '💩 Score: 0', { font: '24px Arial', fill: '#fff' });
    this.scoreText.setDepth(9); // UI text between bg and fg
    
    // Health display as emoji array
    this.healthContainer = this.add.container(10, 40);
    this.healthContainer.setDepth(9);
    this.healthEmojis = [];
    this.updateHealthDisplay();
    
    // Game over state
    this.gameOver = false;
    this.gameOverOverlay = null;
    
    // Debug graphics for collision rectangles
    this.debugGraphics = this.add.graphics();
    this.debugGraphics.setDepth(8); // Debug graphics between bg and fg
    this.showDebug = false; // Toggle with 'D' key
    
    // Speech bubble for item feedback
    this.currentBubble = null;
  }

  spawnItem() {
    const { width } = this.sys.game.config;
    const x = Phaser.Math.Between(30, width - 30);
    const y = -30; // top off-screen
    
    // Define item types with their properties
    const itemTypes = [
      { sprite: 'poo.png', type: 'poo', effect: 'score', value: 1, probability: 0.4, text: ['Njam!', 'Ukusno!', 'Srać! Srać!', 'Slurp!'] },
      { sprite: 'ox.png', type: 'bull', effect: 'speed', value: 5, probability: 0.15, text: ['Đuka!', 'Đuka u studiju!', 'Volem mošnjus!'] },
      { sprite: 'money.png', type: 'money', effect: 'life', value: 1, probability: 0.02, text: ['RTS pretplata - meni!', 'Saćemo da blatimo!', 'Plači sirotiljo!'] },
      { sprite: 'toilet.png', type: 'toilet', effect: 'slowmo', value: 5, probability: 0.15, text: ['Proteralo me...', 'Moram da kenjam!', 'Ček...'] },
      { sprite: 'pump.png', type: 'gas', effect: 'damage', value: 1, probability: 0.1, text: ['Au', 'Joj...', 'Pumpaju jako...'] },
      { sprite: 'fist.png', type: 'fist', effect: 'damage', value: 1, probability: 0.05, text: ['Nemoj!', 'Nemo\' ja sam srčani bolesnik', 'Joj'] },
      { sprite: 'egg.png', type: 'egg', effect: 'damage', value: 1, probability: 0.05, text: ['Pravo na oko!', 'Joj!', 'Uf!'] },
      { sprite: 'horse.png', type: 'horse', effect: 'damage', value: 1, probability: 0.05, text: ['Neću da vrtim glavu!', 'Nije vas sramota!', 'Kao smešno, a?'] }
    ];
    
    // Weighted random selection based on probabilities
    const selectedItem = this.selectWeightedItem(itemTypes);
    const item = this.add.image(x, y, 'govnojed', selectedItem.sprite);
      console.log(selectedItem.type, selectedItem);
    
    // Set origin to center for proper rotation
    item.setOrigin(0.5, 0.5);
    
    // Set item properties
    item.speed = 0.6; // matches foreground speed
    item.itemType = selectedItem.type;
    item.effect = selectedItem.effect;
    item.value = selectedItem.value;
    item.speechText = selectedItem.text;
    item.rotationSpeed = (Math.random() - 0.5) * 0.1;
    item.lifetime = 5000; // 5 seconds lifetime
    item.spawnTime = this.time.now; // Record spawn time
    item.isFading = false; // Flag to prevent multiple fade animations
    
    this.itemGroup.add(item);
    
    // Accelerate spawn rate
    this.accelerateSpawnRate();
  }

  // Accelerate spawn rate over time
  accelerateSpawnRate() {
    // Decrease spawn delay (but not below minimum)
    this.spawnDelay = Math.max(this.spawnDelay - this.spawnAcceleration, this.minSpawnDelay);
    
    // Update the timer with new delay
    this.spawnTimer.destroy();
    this.spawnTimer = this.time.addEvent({
      delay: this.spawnDelay,
      loop: true,
      callback: this.spawnItem,
      callbackScope: this
    });
  }

  // Activate speed boost
  activateSpeedBoost(duration) {
    this.speedBoostActive = true;
    this.speedBoostDuration = duration * 1000; // Convert seconds to milliseconds
    this.speedBoostStartTime = this.time.now;
    
    // Visual feedback - character tint
    this.char.setTint(0x00ff00); // Green tint for speed boost
    
    // Inform user with speech bubble
    this.showItemBubble(`🚀 Speed Boost! ${duration}s`);
    
    // Set up speed boost timer
    this.time.delayedCall(this.speedBoostDuration, () => {
      this.deactivateSpeedBoost();
    });
  }

  // Deactivate speed boost
  deactivateSpeedBoost() {
    this.speedBoostActive = false;
    this.char.clearTint(); // Remove green tint
    
    // Inform user that speed boost ended
    this.showItemBubble('Speed boost ended!');
  }

  // Activate slow-motion
  activateSlowmo(duration) {
    this.slowmoActive = true;
    this.slowmoDuration = duration * 1000; // Convert seconds to milliseconds
    this.slowmoStartTime = this.time.now;
    
    // Visual feedback - character tint
    this.char.setTint(0x800080); // Purple tint for slow-motion
    
    // Inform user with speech bubble
    this.showItemBubble(`🐌 Slow Motion! ${duration}s`);
    
    // Set up slow-motion timer
    this.time.delayedCall(this.slowmoDuration, () => {
      this.deactivateSlowmo();
    });
  }

  // Deactivate slow-motion
  deactivateSlowmo() {
    this.slowmoActive = false;
    this.char.clearTint(); // Remove purple tint
    
    // Inform user that slow-motion ended
    this.showItemBubble('Slow motion ended!');
  }

  // Setup mobile touch controls
  setupMobileControls() {
    const touchArea = document.getElementById('mobileTouchArea');
    if (!touchArea) return;

    // Touch start - determine direction based on touch position relative to player
    const handleTouchStart = (e) => {
      e.preventDefault();
      const touch = e.touches ? e.touches[0] : e;
      const touchX = touch.clientX;
      const canvasRect = this.sys.game.canvas.getBoundingClientRect();
      const relativeX = touchX - canvasRect.left;
      
      // Scale touch coordinates from visual canvas size to game coordinates
      const scaleX = 752 / canvasRect.width; // 752 is the original game width
      const scaledTouchX = relativeX * scaleX;
      
      // Get player position on screen
      const playerScreenX = this.char.x;
      
      // Determine if touch is left or right of player
      if (scaledTouchX < playerScreenX) {
        this.mobileInput.left = true;
        this.mobileInput.right = false;
      } else if (scaledTouchX > playerScreenX) {
        this.mobileInput.right = true;
        this.mobileInput.left = false;
      } else {
        // Touch is on player - jump
        this.mobileInput.jump = true;
        this.mobileInput.left = false;
        this.mobileInput.right = false;
      }
    };

    // Touch end - stop all movement
    const handleTouchEnd = (e) => {
      e.preventDefault();
      this.mobileInput.left = false;
      this.mobileInput.right = false;
      this.mobileInput.jump = false;
    };

    // Mouse events for testing on desktop
    const handleMouseDown = (e) => {
      e.preventDefault();
      const mouseX = e.clientX;
      const canvasRect = this.sys.game.canvas.getBoundingClientRect();
      const relativeX = mouseX - canvasRect.left;
      
      // Scale mouse coordinates from visual canvas size to game coordinates
      const scaleX = 752 / canvasRect.width; // 752 is the original game width
      const scaledMouseX = relativeX * scaleX;
      
      const playerScreenX = this.char.x;
      
      if (scaledMouseX < playerScreenX) {
        this.mobileInput.left = true;
        this.mobileInput.right = false;
      } else if (scaledMouseX > playerScreenX) {
        this.mobileInput.right = true;
        this.mobileInput.left = false;
      } else {
        this.mobileInput.jump = true;
        this.mobileInput.left = false;
        this.mobileInput.right = false;
      }
    };

    const handleMouseUp = (e) => {
      e.preventDefault();
      this.mobileInput.left = false;
      this.mobileInput.right = false;
      this.mobileInput.jump = false;
    };

    // Add event listeners
    touchArea.addEventListener('touchstart', handleTouchStart);
    touchArea.addEventListener('touchend', handleTouchEnd);
    touchArea.addEventListener('mousedown', handleMouseDown);
    touchArea.addEventListener('mouseup', handleMouseUp);
  }

  // Rectangle collision detection function
  checkRectCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.width &&
           rect1.x + rect1.width > rect2.x &&
           rect1.y < rect2.y + rect2.height &&
           rect1.y + rect1.height > rect2.y;
  }

  // Weighted random selection for item types
  selectWeightedItem(itemTypes) {
    // Calculate total probability
    const totalProbability = itemTypes.reduce((sum, item) => sum + item.probability, 0);
    
    // Generate random number between 0 and total probability
    const random = Math.random() * totalProbability;
    
    // Find which item the random number falls into
    let cumulativeProbability = 0;
    
    for (const item of itemTypes) {
      cumulativeProbability += item.probability;
      if (random <= cumulativeProbability) {
        return item;
      }
    }
    
    // Fallback to last item if something goes wrong
    return itemTypes[itemTypes.length - 1];
  }

  // Load high score from localStorage
  loadHighScore() {
    const saved = localStorage.getItem('debilanHighScore');
    return saved ? parseInt(saved, 10) : 0;
  }

  // Save high score to localStorage
  saveHighScore(score) {
    if (score > this.highScore) {
      this.highScore = score;
      localStorage.setItem('debilanHighScore', score.toString());
    }
  }

  // Draw debug rectangle
  drawDebugRect(rect, color = 0x00ff00) {
    this.debugGraphics.lineStyle(2, color);
    this.debugGraphics.strokeRect(rect.x, rect.y, rect.width, rect.height);
  }

  // Clear debug graphics
  clearDebugGraphics() {
    this.debugGraphics.clear();
  }

  // Show item text speech bubble
  showItemBubble(text) {
    // Destroy existing speech bubble if it exists
    if (this.currentBubble) {
      this.currentBubble.destroy();
    }

    // Create new speech bubble with emoji text
    this.currentBubble = this.createSpeechBubble(text);
    
    // Position it above and to the right of the character
    this.currentBubble.setPosition(this.char.x + 50, this.char.y - 150);

    // Calculate dynamic duration based on text length
    const baseDuration = 1000; // Base 1 second
    const charDuration = 50; // 50ms per character
    const maxDuration = 4000; // Maximum 4 seconds
    const minDuration = 800; // Minimum 0.8 seconds
    
    const textLength = text.length;
    const dynamicDuration = Math.min(
      Math.max(baseDuration + (textLength * charDuration), minDuration),
      maxDuration
    );

    // Auto-destroy after calculated duration
    this.time.delayedCall(dynamicDuration, () => {
      if (this.currentBubble) {
        this.currentBubble.destroy();
        this.currentBubble = null;
      }
    });
  }

  // Update health display with emoji array
  updateHealthDisplay() {
    // Clear existing health emojis
    this.healthEmojis.forEach(emoji => emoji.destroy());
    this.healthEmojis = [];
    
    // Create health emojis (money bags)
    for (let i = 0; i < this.health; i++) {
      const healthEmoji = this.add.text(i * 35, 0, '💰', { fontSize: '24px' });
      healthEmoji.setOrigin(0, 0);
      this.healthEmojis.push(healthEmoji);
      this.healthContainer.add(healthEmoji);
    }
  }

  // Game over sequence
  gameOverSequence() {
    if (this.gameOver) return; // Prevent multiple calls
    
    this.gameOver = true;
    
    // Stop all emoji spawning
    this.time.removeAllEvents();
    
    // Dramatic death animation
    this.tweens.add({
      targets: this.char,
      rotation: Math.PI * 4, // 2 full rotations
      scaleX: 0,
      scaleY: 0,
      duration: 500,
      ease: 'Elastic.easeOut',
      onComplete: () => {
        // Hide the character
        this.char.setVisible(false);
        
        // Create poo item sprite at character position
        this.deathPoo = this.add.image(this.char.x, this.char.y, 'govnojed', 'poop.png');
        this.deathPoo.setOrigin(0.5, 0.5);
        this.deathPoo.setDepth(5); // Same depth as character
        this.deathPoo.setScale(0.1); // Start very small
        
        // Scale up and fade tint
        this.tweens.add({
          targets: this.deathPoo,
          scaleX: 2,
          scaleY: 2,
          duration: 800,
          ease: 'Elastic.easeOut',
          onComplete: () => {
            // Create fade overlay
            this.gameOverOverlay = this.add.graphics();
            this.gameOverOverlay.fillStyle(0x000000, 1);
            this.gameOverOverlay.setAlpha(0);
            this.gameOverOverlay.fillRect(0, 0, this.sys.game.config.width, this.sys.game.config.height);
            this.gameOverOverlay.setDepth(20);
            
            // Fade to black
            this.tweens.add({
              targets: this.gameOverOverlay,
              alpha: 0.5,
              duration: 500,
            });

            // Now fall off screen
            this.tweens.add({
              targets: this.deathPoo,
              y: this.sys.game.config.height + 500,
              duration: 1000,
              ease: 'Power2',
              onComplete: () => {
                // Save high score before transitioning
                this.saveHighScore(this.score);
                
                // Transition to game over scene
                this.scene.start('GameOverScene', {
                  score: this.score,
                  highScore: this.highScore,
                  isNewHighScore: this.score === this.highScore && this.score > 0
                });
              }
            });
          }
        });
      }
    });
  }


  // Check for automatic kicking
  checkAutoKick() {
    this.itemGroup.getChildren().forEach(item => {
      // Only kick items that are on the ground and not already kicked
      if (item.y >= this.groundLevel && !item.isKicked) {
        const distance = Math.abs(item.x - this.char.x);
        
        // Check if item is within kick range
        if (distance <= this.kickRange) {
          // Mark as kicked to prevent multiple kicks
          item.isKicked = true;
          
          // Determine kick direction and add physics
          const kickDirection = item.x < this.char.x ? -1 : 1;
          item.kickSpeedX = 8 * kickDirection; // Horizontal kick speed
          item.kickSpeedY = -3; // Upward velocity for parabola
          item.gravity = 0.2; // Gravity effect
          item.kickDecay = 0.98; // Air resistance
          
          // Visual feedback - make item slightly larger and tinted
          item.setScale(1.2);
          item.setTint(0xffff00); // Yellow tint
          
          // Remove tint after a short time
          this.time.delayedCall(200, () => {
            item.clearTint();
            item.setScale(1.0);
          });
        }
      }
    });
  }

  update() {
    // Don't update game logic if game over
    if (this.gameOver) return;
    
    // Toggle debug mode with 'D' key
    if (Phaser.Input.Keyboard.JustDown(this.debugKey)) {
      this.showDebug = !this.showDebug;
    }

    // Background scrolling
    this.bg.tilePositionX -= 0.2;
    this.fg.tilePositionX -= 0.6;

    // Character horizontal movement
    const currentMoveSpeed = this.speedBoostActive ? this.boostedSpeed : this.normalSpeed;
    if (this.cursors.left.isDown || this.mobileInput.left) {
      this.char.x = Math.max(this.minX, this.char.x - currentMoveSpeed);
    } else if (this.cursors.right.isDown || this.mobileInput.right) {
      this.char.x = Math.min(this.maxX, this.char.x + currentMoveSpeed);
    }
    
    // Update head collider position
    this.charHeadCollider.x = this.char.x - 20;
    this.charHeadCollider.y = this.char.y - 80;

    // Jump action
    const isJumpPressed = Phaser.Input.Keyboard.JustDown(this.space) || this.cursors.up.isDown || (this.mobileInput.jump && !this.mobileJumpPressed);
    if (isJumpPressed && !this.isJumping) {
      this.isJumping = true;
      this.mobileJumpPressed = this.mobileInput.jump; // Track mobile jump state
      this.char.play('jump');
      this.tweens.add({
        targets: this.char,
        y: this.char.y - 80,
        duration: 250,
        yoyo: true,
        ease: 'Quad.easeOut',
        onComplete: () => {
          this.char.play('run');
          this.isJumping = false;
          this.mobileJumpPressed = false; // Reset mobile jump tracking
        }
      });
    }
    
    // Reset mobile jump input after processing
    if (this.mobileInput.jump) {
      this.mobileInput.jump = false;
    }

    // Automatic kick detection
    this.checkAutoKick();

    // Update item positions
    this.itemGroup.getChildren().forEach(item => {
      // Handle kicked items with parabolic trajectory
      if (item.isKicked) {
        // Apply horizontal movement
        item.x += item.kickSpeedX;
        item.kickSpeedX *= item.kickDecay; // Air resistance
        
        // Apply vertical movement (parabola)
        item.y += item.kickSpeedY;
        item.kickSpeedY += item.gravity; // Gravity pulls down
        
        // Destroy if off screen or moving too slowly
        if (item.x < -50 || item.x > this.sys.game.config.width + 50 || 
            Math.abs(item.kickSpeedX) < 0.1) {
          item.destroy();
        }
      } else {
        // Only fall if above ground level
        if (item.y < this.groundLevel) {
          const fallSpeed = this.slowmoActive ? item.speed * 4 * this.slowmoMultiplier : item.speed * 4;
          item.y += fallSpeed; // multiply for visible falling speed
          // Move horizontally at background speed when falling
          const horizontalSpeed = this.slowmoActive ? 0.5 * this.slowmoMultiplier : 0.5;
          item.x += horizontalSpeed; // matches background speed
          // Rotate while falling
          const rotationSpeed = this.slowmoActive ? item.rotationSpeed * this.slowmoMultiplier : item.rotationSpeed;
          item.rotation += rotationSpeed;
        } else {
          // Normal horizontal movement (match foreground speed) when on ground
          const groundSpeed = this.slowmoActive ? 0.2 * this.slowmoMultiplier : 0.2;
          item.x += groundSpeed;
        }
      }

      // Check collision with character using rectangle collision (only non-kicked items)
      if (!item.isKicked) {
        const itemCollider = {
          x: item.x - item.displayWidth / 2,  // Item position (centered)
          y: item.y - item.displayHeight / 2,  // Item position (centered)
          width: item.displayWidth,
          height: item.displayHeight
        };
        
        // Check head collision for all items
        if (this.checkRectCollision(this.charHeadCollider, itemCollider)) {
          if (item.effect === 'score') {
            // Item increases score when collected by head
            this.score += item.value;
            this.scoreText.setText('💩 Score: ' + this.score);
            
            // Change to jumping texture for 0.5 seconds
            this.char.play('jump');
            this.time.delayedCall(500, () => {
              if (!this.isJumping) {
                this.char.play('run');
              }
            });

            // Show item text speech bubble (randomly select if array)
            const speechText = Array.isArray(item.speechText) 
              ? Phaser.Utils.Array.GetRandom(item.speechText) 
              : item.speechText;
            this.showItemBubble(speechText);
          } else if (item.effect === 'life') {
            // Money gives extra life
            this.health += item.value;
            this.updateHealthDisplay();
            
            // Change to jumping texture for 0.5 seconds
            this.char.play('jump');
            this.time.delayedCall(500, () => {
              if (!this.isJumping) {
                this.char.play('run');
              }
            });

            // Show item text speech bubble (randomly select if array)
            const speechText = Array.isArray(item.speechText) 
              ? Phaser.Utils.Array.GetRandom(item.speechText) 
              : item.speechText;
            this.showItemBubble(speechText);
          } else if (item.effect === 'speed') {
            // Ox gives speed boost
            this.activateSpeedBoost(item.value);
            
            // Change to jumping texture for 0.5 seconds
            this.char.play('jump');
            this.time.delayedCall(500, () => {
              if (!this.isJumping) {
                this.char.play('run');
              }
            });

            // Show item text speech bubble (randomly select if array)
            const speechText = Array.isArray(item.speechText) 
              ? Phaser.Utils.Array.GetRandom(item.speechText) 
              : item.speechText;
            this.showItemBubble(speechText);
          } else if (item.effect === 'slowmo') {
            // Toilet gives slow-motion
            this.activateSlowmo(item.value);
            
            // Change to jumping texture for 0.5 seconds
            this.char.play('jump');
            this.time.delayedCall(500, () => {
              if (!this.isJumping) {
                this.char.play('run');
              }
            });

            // Show item text speech bubble (randomly select if array)
            const speechText = Array.isArray(item.speechText) 
              ? Phaser.Utils.Array.GetRandom(item.speechText) 
              : item.speechText;
            this.showItemBubble(speechText);
          } else if (item.effect === 'damage') {
            // Item hurts the character when hitting head
            this.health -= item.value;
            this.updateHealthDisplay();
            
            // Check for game over
            if (this.health <= 0) {
              this.gameOverSequence();
            }

    // Tint red and shake
    this.char.setTint(0xff0000);
    this.tweens.add({
      targets: this.char,
      x: this.char.x + 10, // shake right
      duration: 50,
      yoyo: true,
      repeat: 3,
      onComplete: () => {
        this.char.clearTint();
      }
    });

            // Show item text speech bubble (randomly select if array)
            const speechText = Array.isArray(item.speechText) 
              ? Phaser.Utils.Array.GetRandom(item.speechText) 
              : item.speechText;
            this.showItemBubble(speechText);
          }
          
          item.destroy();
        }
      }

      // Remove if out of horizontal bounds
      if (item.x < -50 || item.x > this.sys.game.config.width + 50) {
        item.destroy();
      }
      
      // Remove if lifetime exceeded
      if (this.time.now - item.spawnTime > item.lifetime && !item.isFading) {
        // Mark as fading to prevent multiple animations
        item.isFading = true;
        
        // Fade out before destroying
        this.tweens.add({
          targets: item,
          alpha: 0,
          duration: 500,
          ease: 'Power2',
          onComplete: () => {
            item.destroy();
          }
        });
      }
    });

    // Draw debug rectangles
    if (this.showDebug) {
      this.clearDebugGraphics();
      
      // Draw ground level line (yellow)
      this.debugGraphics.lineStyle(2, 0xffff00);
      this.debugGraphics.lineBetween(0, this.groundLevel, this.sys.game.config.width, this.groundLevel);
      
      // Draw character head collider (blue)
      this.drawDebugRect(this.charHeadCollider, 0x0000ff);
      
      // Draw kick range (orange)
      const kickCollider = {
        x: this.char.x - this.kickRange,
        y: this.char.y - 20,
        width: this.kickRange * 2,
        height: 40
      };
      this.drawDebugRect(kickCollider, 0xff8800);
      
      // Draw item colliders with different colors based on type
      this.itemGroup.getChildren().forEach(item => {
        const itemCollider = {
          x: item.x - item.displayWidth / 2,  // Item position (centered)
          y: item.y - item.displayHeight / 2,  // Item position (centered)
          width: item.displayWidth,
          height: item.displayHeight
        };
        
        // Color code based on item effect
        let color = 0xff0000; // default red
        if (item.effect === 'score') {
          color = 0x00ff00; // green for score
        } else if (item.effect === 'life') {
          color = 0x00ffff; // cyan for life
        } else if (item.effect === 'speed') {
          color = 0xffff00; // yellow for speed
        } else if (item.effect === 'slowmo') {
          color = 0x800080; // purple for slow-motion
        } else if (item.effect === 'damage') {
          color = 0xff0000; // red for damage
        }
        
        this.drawDebugRect(itemCollider, color);
      });
    } else {
      this.clearDebugGraphics();
    }

  }
  createSpeechBubble(quote, maxWidth = 200) {
    const bubblePadding = 10;
    const fontSize = 20;
    const lineHeight = fontSize * 1.2;
    const minWidth = 80;
    const minHeight = 40;

    // Create a container to hold the bubble and text
    const bubbleContainer = this.add.container(0, 0);

    // Create text to measure
    const tempText = this.add.text(0, 0, quote, { 
      fontFamily: 'Arial', 
      fontSize: fontSize, 
      color: '#000000', 
      align: 'center',
      wordWrap: { width: maxWidth - (bubblePadding * 2) }
    });

    // Get text dimensions
    const textBounds = tempText.getBounds();
    const textWidth = textBounds.width;
    const textHeight = textBounds.height;
    
    // Calculate bubble dimensions
    const bubbleWidth = Math.max(minWidth, textWidth + (bubblePadding * 2));
    const bubbleHeight = Math.max(minHeight, textHeight + (bubblePadding * 2));
    const arrowHeight = bubbleHeight / 4;

    // Create the actual bubble graphics
    const bubble = this.add.graphics();

    //  Bubble shadow
    bubble.fillStyle(0x222222, 0.5);
    bubble.fillRoundedRect(6, 6, bubbleWidth, bubbleHeight, 16);

    //  Bubble color
    bubble.fillStyle(0xffffff, 1);

    //  Bubble outline line style
    bubble.lineStyle(4, 0x565656, 1);

    //  Bubble shape and outline
    bubble.strokeRoundedRect(0, 0, bubbleWidth, bubbleHeight, 16);
    bubble.fillRoundedRect(0, 0, bubbleWidth, bubbleHeight, 16);

    //  Calculate arrow coordinates
    const point1X = Math.floor(bubbleWidth / 7);
    const point1Y = bubbleHeight;
    const point2X = Math.floor((bubbleWidth / 7) * 2);
    const point2Y = bubbleHeight;
    const point3X = Math.floor(bubbleWidth / 7);
    const point3Y = Math.floor(bubbleHeight + arrowHeight);

    //  Bubble arrow shadow
    bubble.lineStyle(4, 0x222222, 0.5);
    bubble.lineBetween(point2X - 1, point2Y + 6, point3X + 2, point3Y);

    //  Bubble arrow fill
    bubble.fillTriangle(point1X, point1Y, point2X, point2Y, point3X, point3Y);
    bubble.lineStyle(2, 0x565656, 1);
    bubble.lineBetween(point2X, point2Y, point3X, point3Y);
    bubble.lineBetween(point1X, point1Y, point3X, point3Y);

    // Create the actual text with proper positioning
    const content = this.add.text(0, 0, quote, { 
      fontFamily: 'Arial', 
      fontSize: fontSize, 
      color: '#000000', 
      align: 'center',
      wordWrap: { width: bubbleWidth - (bubblePadding * 2) }
    });

    // Center the text in the bubble
    const contentBounds = content.getBounds();
    content.setPosition(
      (bubbleWidth / 2) - (contentBounds.width / 2), 
      (bubbleHeight / 2) - (contentBounds.height / 2)
    );

    // Clean up temporary text
    tempText.destroy();

    // Add bubble and text to the container
    bubbleContainer.add(bubble);
    bubbleContainer.add(content);
    
    // Set depth to appear between bg and fg
    bubbleContainer.setDepth(7);

    // Return the container for easy positioning and management
    return bubbleContainer;
  }
}

const config = {
  type: Phaser.AUTO,
  width: 752,
  height: 576,
  scene: [StartScene, ParallaxScene, GameOverScene],
  debug: false
};

new Phaser.Game(config);
